[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools-scm>=8"]

[project]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
]
dependencies = [
    "ansi2html~=1.9.5",
    "cloup~=4.0.0",
    "colorama~=0.4.6",
    "flask~=3.1.3",
    "pypdf~=6.19.0",
    "questionary~=2.1.1",
    "typst~=0.15.0",
    "tomlkit~=0.15.1",
    "msgspec~=0.22.0",
    "tomli-w~=1.2.0",
    "pygls~=2.1.1",
    "lsprotocol~=2025.0.0",
]
description = "Automatize task creation for OCI"
dynamic = ["version"]
name = "ocimatic"
requires-python = ">= 3.12"
urls = { Source = "https://github.com/OCIoficial/ocimatic" }

[dependency-groups]
dev = ["mypy==2.4.0", "pyright==1.1.414", "pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
ocimatic = "ocimatic:main"

[tool.setuptools.package-data]
ocimatic = ["resources/**/*", "templates/**/*"]

[tool.setuptools_scm]

[tool.pyright]
pythonPlatform = "All"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not e2e"]
strict = true
markers = [
    "e2e: end-to-end tests that run the installed `ocimatic` command (need javac and a C++ compiler). Run with `pytest -m e2e`.",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "ANN401",
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "E501",
    "E731",
    "PYI034",
]
select = [
    "ANN",
    "B",
    "C4",
    "COM",
    "D",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "ISC",
    "N",
    "PERF",
    "PTH",
    "PYI",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"ocimatic/resources/.github/scripts/read_typesetting.py" = ["ALL"]
"setup.py" = ["PTH"]
